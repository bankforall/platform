[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [
  { access = "read", path = "../shared/test-vectors" },
  { access = "read-write", path = "./deployments" },
]

[fmt]
line_length = 110

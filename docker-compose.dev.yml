# Local development dependencies: `docker compose -f docker-compose.dev.yml up -d`
# Then: deploy contracts (scripts/dev-deploy.sh), `pnpm --filter @bankforall/api dev`, `... dev:worker`, web `dev`.
name: bankforall-dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bankforall
      POSTGRES_PASSWORD: bankforall
      POSTGRES_DB: bankforall
    ports: ["54329:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankforall"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["56379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: bankforall
      MINIO_ROOT_PASSWORD: bankforall-secret
    ports: ["59000:9000", "59001:9001"]
    volumes: [miniodata:/data]
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "1"]
    ports: ["58545:8545"]
volumes:
  pgdata:
  miniodata:

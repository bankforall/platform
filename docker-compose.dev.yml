# Local development dependencies (postgres, redis, S3, anvil): `docker compose -f docker-compose.dev.yml up -d`
# Then: deploy contracts (scripts/dev-deploy.sh), `pnpm --filter @bankforall/api dev`, `... dev:worker`, web `dev`.
name: bankforall-dev
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: bankforall
      POSTGRES_PASSWORD: bankforall
      POSTGRES_DB: bankforall
    ports: ["54329:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankforall"]
      interval: 5s
      retries: 10
  redis:
    image: redis:8
    ports: ["56379:6379"]
  s3:
    # S3-compatible object storage (SeaweedFS; MinIO's community image is no longer published)
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["sh", "-c"]
    command: ['printf ''{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json && exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json']
    environment:
      S3_ACCESS_KEY: bankforall
      S3_SECRET_KEY: bankforall-secret
    ports: ["59000:8333"]
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      retries: 20
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "1"]
    ports: ["58545:8545"]
volumes:
  pgdata:
  s3data:

name: Release

# Push a tag like v1.2.3 → images ghcr.io/bankforall/platform-{api,migrate,web}:1.2.3 (+ :latest),
# each with an SBOM and a signed build-provenance attestation. Servers then run IMAGE_TAG=1.2.3.
# The web image pins the chain and contracts it will sign for: set the repository variables
# VITE_CHAIN_ID, VITE_FORWARDER_ADDRESS and VITE_FACTORY_ADDRESS (Settings → Variables) after
# deploying the contracts; without them only api/migrate are released.
# Optional: VITE_APP_NAME / VITE_APP_SHORT_NAME set the user-visible product name (default "Bank For All").
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - { name: api, dockerfile: apps/api/Dockerfile, target: runtime }
          - { name: migrate, dockerfile: apps/api/Dockerfile, target: migrate }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/platform-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/platform-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  web:
    if: vars.VITE_FACTORY_ADDRESS != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/platform-web
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_CHAIN_ID=${{ vars.VITE_CHAIN_ID }}
            VITE_FORWARDER_ADDRESS=${{ vars.VITE_FORWARDER_ADDRESS }}
            VITE_FACTORY_ADDRESS=${{ vars.VITE_FACTORY_ADDRESS }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_APP_SHORT_NAME=${{ vars.VITE_APP_SHORT_NAME }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/platform-web
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

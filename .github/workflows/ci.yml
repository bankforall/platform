name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.4
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv

  slither:
    # Static analysis; accepted detectors are documented in packages/contracts/slither.config.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        with:
          target: packages/contracts
          slither-config: packages/contracts/slither.config.json
          fail-on: medium

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bankforall/shared build
      - run: pnpm --filter @bankforall/api exec prisma generate
      - run: pnpm -r --filter "./apps/*" --filter "./packages/shared" typecheck
      - run: pnpm --filter @bankforall/shared test
      - run: pnpm --filter @bankforall/api test
      - run: pnpm --filter @bankforall/web test
      - run: pnpm --filter @bankforall/web build

  e2e:
    # Full stack: postgres, redis, minio and anvil with freshly deployed contracts.
    needs: [contracts, typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f docker-compose.dev.yml up -d --wait postgres redis s3 anvil
      - run: ./scripts/dev-deploy.sh
      - run: pnpm --filter @bankforall/shared build
      - run: pnpm --filter @bankforall/api exec prisma generate
      - name: Migrate
        working-directory: apps/api
        run: set -a && . ./.env && set +a && npx prisma migrate deploy
      - name: API end-to-end (HTTP + chain)
        working-directory: apps/api
        run: set -a && . ./.env && set +a && pnpm test:e2e
      - name: Browser end-to-end
        run: |
          (cd apps/api && set -a && . ./.env && set +a && npx tsx src/server.ts > /tmp/api.log 2>&1 &)
          (cd apps/api && set -a && . ./.env && set +a && npx tsx src/worker.ts > /tmp/worker.log 2>&1 &)
          (pnpm --filter @bankforall/web dev > /tmp/web.log 2>&1 &)
          npx --prefix e2e playwright install --with-deps chromium
          for i in $(seq 1 90); do curl -sf localhost:4000/api/health && curl -sf localhost:5173 >/dev/null && break; sleep 2; done
          pnpm --filter @bankforall/e2e test
      - if: failure()
        run: tail -n 200 /tmp/api.log /tmp/worker.log /tmp/web.log || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  docker:
    needs: [typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker build -f apps/api/Dockerfile --target runtime -t bankforall-api .
      - run: docker build -f apps/api/Dockerfile --target migrate -t bankforall-migrate .
      - run: >-
          docker build -f apps/web/Dockerfile -t bankforall-web
          --build-arg VITE_CHAIN_ID=31337
          --build-arg VITE_FORWARDER_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3
          --build-arg VITE_FACTORY_ADDRESS=0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512 .

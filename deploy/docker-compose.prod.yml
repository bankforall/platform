# Production on a single VPS:
#   cp .env.production.example .env.production   # fill in secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: bankforall
x-app: &app
  build:
    context: ..
    dockerfile: apps/api/Dockerfile
  image: bankforall-api:latest
  env_file: .env.production
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    s3: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: bankforall-web:latest
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [api]
    logging: *logging

  api:
    <<: *app
    command: ["node", "dist/server.js"]
    expose: ["4000"]

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    healthcheck:
      disable: true

  migrate:
    <<: *app
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      disable: true

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: bankforall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bankforall
    volumes: [pgdata:/var/lib/postgresql] # postgres 18+ layout
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankforall"]
      interval: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging

  s3:
    # S3-compatible object storage for KYC files and slips (already encrypted by the app).
    # SeaweedFS replaces MinIO, whose community image is no longer published.
    # To use a managed S3 instead, set S3_ENDPOINT/keys in .env.production and drop this service.
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command: ['printf ''{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json && exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json']
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      retries: 20
    logging: *logging

volumes:
  pgdata:
  redisdata:
  s3data:
  caddy_data:
  caddy_config:

# Production on a single VPS:
#   cp .env.production.example .env.production   # fill in secrets (chmod 600)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Or run released images:  set IMAGE_TAG, then `... pull && ... up -d`
#
# Least privilege: no service receives the whole .env file. Each one gets only the variables it
# needs, and the three blockchain keys live in three different containers.
name: bankforall

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  tmpfs: ["/tmp:size=64m"]

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-api-image: &api-image
  build:
    context: ..
    dockerfile: apps/api/Dockerfile
    target: runtime
  image: ${IMAGE_REGISTRY:-ghcr.io/bankforall}/platform-api:${IMAGE_TAG:-latest}

# alert channels (docs/v2/deployment.md "การแจ้งเตือน"): api, worker and signer all raise alerts
x-alert-env: &alert-env
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  ALERT_WEBHOOK_FORMAT: ${ALERT_WEBHOOK_FORMAT:-json}
  ALERT_THROTTLE_MINUTES: ${ALERT_THROTTLE_MINUTES:-30}

# shared by api + worker (not the signer)
x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PUBLIC_URL: ${PUBLIC_URL}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  SESSION_SECRET: ${SESSION_SECRET}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
  HMAC_KEY: ${HMAC_KEY}
  LINE_CHANNEL_ID: ${LINE_CHANNEL_ID}
  LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
  LINE_MESSAGING_TOKEN: ${LINE_MESSAGING_TOKEN:-}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  CHAIN_ID: ${CHAIN_ID}
  RPC_URL: ${RPC_URL}
  EXPLORER_URL: ${EXPLORER_URL:-}
  FACTORY_ADDRESS: ${FACTORY_ADDRESS}
  FORWARDER_ADDRESS: ${FORWARDER_ADDRESS}
  DEPLOY_BLOCK: ${DEPLOY_BLOCK}
  CONFIRMATIONS: ${CONFIRMATIONS:-3}
  MIN_GAS_BALANCE_WEI: ${MIN_GAS_BALANCE_WEI:-3000000000000000}
  SIGNER_URL: http://signer:4100
  SIGNER_TOKEN: ${SIGNER_TOKEN}
  SLIP_VERIFIER: ${SLIP_VERIFIER:-none}
  KEY_ROTATION_DELAY_HOURS: ${KEY_ROTATION_DELAY_HOURS:-24}
  <<: *alert-env
  ALERT_LINE_TO: ${ALERT_LINE_TO:-}

x-depends: &depends
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }
  s3: { condition: service_healthy }
  migrate: { condition: service_completed_successfully }

services:
  web:
    <<: *hardening
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # the PWA refuses to sign for any other chain/contract than these (pinned at build time)
      args:
        VITE_CHAIN_ID: ${CHAIN_ID}
        VITE_FORWARDER_ADDRESS: ${FORWARDER_ADDRESS}
        VITE_FACTORY_ADDRESS: ${FACTORY_ADDRESS}
    image: ${IMAGE_REGISTRY:-ghcr.io/bankforall}/platform-web:${IMAGE_TAG:-latest}
    cap_add: [NET_BIND_SERVICE] # Caddy binds 80/443
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [api]
    logging: *logging

  api:
    <<: [*hardening, *api-image]
    command: ["node", "dist/server.js"]
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "4000"
      DEV_LOGIN: "false"
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY}
      # OTP SMS is sent by the api only
      SMS_PROVIDER: ${SMS_PROVIDER}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      THAIBULKSMS_API_KEY: ${THAIBULKSMS_API_KEY:-}
      THAIBULKSMS_API_SECRET: ${THAIBULKSMS_API_SECRET:-}
      THAIBULKSMS_SENDER: ${THAIBULKSMS_SENDER:-}
      THAIBULKSMS_FORCE: ${THAIBULKSMS_FORCE:-}
    expose: ["4000"]
    depends_on:
      <<: *depends
      signer: { condition: service_started }
    logging: *logging

  worker:
    <<: [*hardening, *api-image]
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      <<: *app-env
      KEEPER_PRIVATE_KEY: ${KEEPER_PRIVATE_KEY}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-5000}
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      ALERT_JOB_FAILURES: ${ALERT_JOB_FAILURES:-5}
      INDEXER_LAG_ALERT_BLOCKS: ${INDEXER_LAG_ALERT_BLOCKS:-300}
      # slips are verified by the worker only
      SLIPOK_BRANCH_ID: ${SLIPOK_BRANCH_ID:-}
      SLIPOK_API_KEY: ${SLIPOK_API_KEY:-}
      SLIP_VERIFY_MAX_ATTEMPTS: ${SLIP_VERIFY_MAX_ATTEMPTS:-8}
    healthcheck:
      disable: true
    depends_on:
      <<: *depends
      signer: { condition: service_started }
    logging: *logging

  # Holds the attester key. Internal network only (no ports); every signature is policy-checked.
  signer:
    <<: [*hardening, *api-image]
    command: ["node", "dist/signer.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CHAIN_ID: ${CHAIN_ID}
      RPC_URL: ${RPC_URL}
      FACTORY_ADDRESS: ${FACTORY_ADDRESS}
      FORWARDER_ADDRESS: ${FORWARDER_ADDRESS}
      ATTESTER_PRIVATE_KEY: ${ATTESTER_PRIVATE_KEY}
      SIGNER_TOKEN: ${SIGNER_TOKEN}
      SIGNER_PORT: "4100"
      MIN_GAS_BALANCE_WEI: ${MIN_GAS_BALANCE_WEI:-3000000000000000}
      PUBLIC_URL: ${PUBLIC_URL}
      <<: *alert-env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    logging: *logging

  migrate:
    <<: *hardening
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: ${IMAGE_REGISTRY:-ghcr.io/bankforall}/platform-migrate:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: bankforall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bankforall
    volumes: [pgdata:/var/lib/postgresql] # postgres 18+ layout
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankforall"]
      interval: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:8
    restart: unless-stopped
    # the password goes into a config file at start, so it never appears on a command line (`ps`);
    # the image's entrypoint still drops privileges to the redis user
    entrypoint:
      ["sh", "-c", "umask 077 && printf 'requirepass %s\\nappendonly yes\\n' \"$$REDIS_PASSWORD\" > /tmp/redis.conf && chown redis /tmp/redis.conf && exec docker-entrypoint.sh redis-server /tmp/redis.conf"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      retries: 20
    logging: *logging

  s3:
    # S3-compatible object storage for KYC files and slips (already encrypted by the app).
    # SeaweedFS replaces MinIO, whose community image is no longer published.
    # To use a managed S3 instead, set S3_ENDPOINT/keys in .env.production and drop this service.
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      [
        'printf ''{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json && exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json',
      ]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      retries: 20
    logging: *logging

volumes:
  pgdata:
  redisdata:
  s3data:
  caddy_data:
  caddy_config:
